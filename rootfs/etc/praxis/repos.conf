# Praxis package repositories
#
# Each repo block defines one source. Fields:
#   name    — short label shown in praxis-pkg output
#   url     — base URL of the repo root (must serve INDEX.gz and .prx files)
#   enabled — yes/no
#   signed  — yes/no (require GPG signature on INDEX.gz)
#
# Package identifiers use reverse-domain notation: tld.org.pkgname
# e.g. dev.praxis.neovim, org.mozilla.firefox, org.videolan.vlc

[repo]
name    = praxis-core
url     = https://pkg.praxis.dev/core
enabled = yes
signed  = yes

[repo]
name    = praxis-extra
url     = https://pkg.praxis.dev/extra
enabled = yes
signed  = yes

[repo]
name    = praxis-community
url     = https://pkg.praxis.dev/community
enabled = yes
signed  = no
