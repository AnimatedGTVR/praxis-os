NAME=s6
TITLE=s6 init policy
RDINIT=/etc/s6/rc-init
REQUIRED_FILES=/etc/s6/rc-init,/sbin/s6-svscan,/sbin/s6-supervise
REQUIRED_DIRS=/etc/s6,/service
DESCRIPTION=Explicit init choice for operators who want a real, static s6 (skalibs+execline+s6) supervision tree. Build with make s6 / PRAXIS_ENABLE_S6=1.
