NAME=busybox
TITLE=BusyBox init with a runit-style supervise tree
RDINIT=/init
REQUIRED_FILES=/init,/bin/busybox,/etc/service/shell/run
REQUIRED_DIRS=/etc,/etc/service
DESCRIPTION=Praxis default init path. /init mounts pseudo filesystems and hands off to BusyBox runsvdir over /etc/service; small, direct, and owned by the live rootfs.
